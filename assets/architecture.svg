<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1000" height="340" rx="12" fill="#ffffff" stroke="#e0e0e0"/>

  <!-- Main pipeline -->
  <g stroke="#333" stroke-width="1.5">
    <rect x="25" y="130" width="150" height="70" rx="8" fill="#f1f3f5"/>
    <rect x="225" y="130" width="150" height="70" rx="8" fill="#e7f0fb"/>
    <rect x="425" y="130" width="150" height="70" rx="8" fill="#e7f0fb"/>
    <rect x="625" y="130" width="150" height="70" rx="8" fill="#e7f0fb"/>
    <rect x="825" y="130" width="150" height="70" rx="8" fill="#f1f3f5"/>
  </g>
  <g text-anchor="middle" fill="#1a1a1a">
    <text x="100" y="161" font-size="15" font-weight="600">Hokuyo LiDAR</text>
    <text x="100" y="181" font-size="12" fill="#555">2D scan</text>
    <text x="300" y="161" font-size="15" font-weight="600">Perception</text>
    <text x="300" y="181" font-size="12" fill="#555">DBSCAN + Kalman filter</text>
    <text x="500" y="161" font-size="15" font-weight="600">Behavioral planner</text>
    <text x="500" y="181" font-size="12" fill="#555">FSM + spline path</text>
    <text x="700" y="161" font-size="15" font-weight="600">Pure pursuit</text>
    <text x="700" y="181" font-size="12" fill="#555">steering + speed</text>
    <text x="900" y="161" font-size="15" font-weight="600">VESC bridge</text>
    <text x="900" y="181" font-size="12" fill="#555">duty cycle + servo</text>
  </g>

  <!-- Main arrows and topic labels -->
  <g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M175 165 H223"/>
    <path d="M375 165 H423"/>
    <path d="M575 165 H623"/>
    <path d="M775 165 H823"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="199" y="120">/scan</text>
    <text x="399" y="120">/lidar_obstacles</text>
    <text x="599" y="120">/target_path</text>
    <text x="799" y="120">/cmd_vel</text>
  </g>

  <!-- Racing line (top) -->
  <rect x="425" y="30" width="150" height="50" rx="8" fill="#fff8e6" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="52" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Racing line</text>
  <text x="500" y="69" text-anchor="middle" font-size="11" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/racing_line</text>
  <path d="M500 80 V128" stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>

  <!-- Hector SLAM (bottom) -->
  <rect x="425" y="260" width="350" height="50" rx="8" fill="#fff8e6" stroke="#333" stroke-width="1.5"/>
  <text x="600" y="282" text-anchor="middle" font-size="14" font-weight="600" fill="#1a1a1a">Hector SLAM</text>
  <text x="600" y="299" text-anchor="middle" font-size="11" fill="#444" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">/slam_out_pose + map to base_link transform</text>
  <g stroke="#555" stroke-width="1.8" fill="none" marker-end="url(#arr)">
    <path d="M100 200 V285 H423"/>
    <path d="M500 258 V202"/>
    <path d="M700 258 V202"/>
    <path d="M300 285 V202" stroke-dasharray="5 4"/>
  </g>
  <text x="310" y="250" font-size="11" fill="#666">tf: map frame</text>

  <!-- Actuators -->
  <text x="900" y="226" text-anchor="middle" font-size="12" fill="#555">to motor + steering servo</text>
</svg>
